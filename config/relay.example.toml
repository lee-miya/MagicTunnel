# Pure relay node: no [exit] section, so it needs no TUN, NAT or root. It forwards each tunnel
# to the next hop the client named and only ever sees its two neighbours.
listen = "0.0.0.0:4433"

[log]
level = "info"

[tls]
ca = "certs/ca.pem"
cert = "certs/relay1.pem"
key = "certs/relay1.key"

[obfs]
# Shared by every node on a path: a relay dials its next hop with this key.
xor_key = "change-me-to-a-long-random-string"

